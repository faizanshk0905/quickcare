server.port=8080
server.address=0.0.0.0

# Spring Application
spring.application.name=quickcare-backend

# Security & Sessions
quickcare.security.jwt.secret=9a3f2b8c7d6e5f4a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a
quickcare.security.jwt.expiration-ms=86400000

# Firebase Configuration
quickcare.firebase.config-path=${FIREBASE_CREDENTIALS:src/main/resources/firebase-service-account.json}
quickcare.firebase.project-id=${FIREBASE_PROJECT_ID:quick-care-healthcare}
quickcare.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:quick-care-healthcare.appspot.com}

# AI Healthcare Assistant
quickcare.ai.api-key=${AI_API_KEY:}
quickcare.ai.provider=GEMINI
quickcare.ai.model=gemini-1.5-flash

# CORS
quickcare.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,https://quick-care-healthcare.web.app

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Scheduling for Appointment Reminders
spring.task.scheduling.pool.size=4

# Logging
logging.level.com.quickcare=INFO
logging.level.org.springframework.security=INFO
